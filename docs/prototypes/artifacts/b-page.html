<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 B · 应用页面 — Terminus Notes</title>
<link rel="stylesheet" href="assets/proto.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side__head"><span class="side__avatar">刘</span><span>刘政东的 Notes</span>
      <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
    </div>
    <div class="side__search"><svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>搜索</div>
    <nav class="side__list">
      <div class="side__sec">
        <div class="side__label">收藏</div>
        <a class="tree is-current" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span class="tree__name">📦 小订单追踪器</span><span class="tree__dot" title="运行中"></span></a>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span class="tree__name">订单</span></a>
      </div>
      <div class="side__sec">
        <div class="side__label">页面</div>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">工作台</span></a>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">本周发货记录</span></a>
        <a class="tree tree--grandchild" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">📦 小订单追踪器</span><span class="tree__kind">APP</span></a>
        <a class="tree tree--grandchild" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span class="tree__name">订单</span></a>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">读书记录</span></a>
      </div>
      <div class="side__sec">
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="tree__name">回收站</span></a>
      </div>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title">
        <span class="crumb-parent">本周发货记录</span>
        <span class="crumb-sep">/</span>
        <span>📦 小订单追踪器</span>
      </span>
      <span class="topbar__tools">
        <button class="icbtn" aria-label="收藏" title="收藏"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button>
        <button class="tbtn">分享</button>
        <button class="icbtn" aria-label="更多"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
      </span>
    </header>

    <div class="body">
      <div class="stage"><div class="stage__inner">

        <!-- The app page's own chrome: what it is, where its data lives,
             and the lifecycle controls. Runs the app full-width. -->
        <section class="appsurface">
          <div class="appsurface__head">
            <span class="appsurface__icon">📦</span>
            <span class="appsurface__name">小订单追踪器</span>
            <span class="appsurface__meta" id="runState">未运行</span>
            <span class="appsurface__acts">
              <a class="tbtn" href="#" title="数据源：订单">
                <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
                订单
              </a>
              <button class="tbtn">
                <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
                源码
              </button>
              <button class="tbtn">
                <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.9 2.9M16.9 16.9l2.9 2.9M1 12h4M19 12h4M4.2 19.8l2.9-2.9M16.9 7.1l2.9-2.9"/></svg>
                设置
              </button>
              <button class="btn btn--ink" id="btnToggle" style="height:28px">
                <svg class="ic ic--sm" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5v15l13-7.5Z"/></svg>运行
              </button>
            </span>
          </div>
          <div class="appsurface__body">
            <div class="stopped" id="stopped">
              <div class="stopped__icon">📦</div>
              <div class="stopped__name">小订单追踪器</div>
              <div class="stopped__meta">小应用 · 数据源「订单」· 5 条记录</div>
              <div class="stopped__acts">
                <button class="btn btn--ink" id="btnRunHero">
                  <svg class="ic ic--sm" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5v15l13-7.5Z"/></svg>运行
                </button>
              </div>
              <div class="stopped__note">脚本不自动执行；打开应用页也会先停在这一步。</div>
            </div>
            <div id="appCanvas" hidden></div>
          </div>
        </section>

      </div></div>
    </div>
  </div>
</div>

<script>
/* same demo slice as a-inline.html */
const STATUS = [
  { id: "todo",  label: "待处理", cls: "pill--todo" },
  { id: "doing", label: "进行中", cls: "pill--doing" },
  { id: "done",  label: "已完成", cls: "pill--done" },
];
let seq = 5;
const orders = [
  { id: 1, name: "青禾文创 · 贴纸 200 张",   status: "doing", note: "顺丰" },
  { id: 2, name: "北岛商店 · 笔记本 ×40",    status: "todo",  note: "缺包装" },
  { id: 3, name: "拾光书店 · 明信片套装",    status: "todo",  note: "" },
  { id: 4, name: "南屿工作室 · 帆布袋 ×12",  status: "done",  note: "已签收" },
];
let flashEl = null;

function pillSelect(order) {
  const s = document.createElement("select");
  s.className = "pill " + STATUS.find(t => t.id === order.status).cls;
  s.setAttribute("aria-label", "状态");
  for (const st of STATUS) {
    const o = document.createElement("option");
    o.value = st.id; o.textContent = st.label;
    if (st.id === order.status) o.selected = true;
    s.appendChild(o);
  }
  s.addEventListener("change", () => {
    order.status = s.value;
    s.className = "pill " + STATUS.find(t => t.id === order.status).cls;
    renderApp(document.getElementById("appCanvas"), true);
  });
  return s;
}

function renderApp(mount, saved) {
  mount.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "miniapp miniapp--pad";
  wrap.innerHTML = `<div class="miniapp__head"><span class="miniapp__count" id="mcount"></span></div>`;

  const add = document.createElement("div");
  add.className = "miniapp__add";
  add.innerHTML = `<input id="mInput" placeholder="记一笔订单，回车提交"><button class="btn btn--ink" id="mAdd">添加</button>`;
  wrap.appendChild(add);

  const list = document.createElement("div");
  list.className = "orders";
  for (const st of STATUS) {
    const group = orders.filter(o => o.status === st.id);
    if (!group.length) continue;
    const g = document.createElement("div");
    g.className = "orders__group";
    g.innerHTML = `<div class="orders__label">${st.label}<span class="n">${group.length}</span></div>`;
    for (const o of group) {
      const row = document.createElement("div");
      row.className = "order";
      const name = document.createElement("span"); name.className = "order__name"; name.textContent = o.name;
      const meta = document.createElement("span"); meta.className = "order__meta"; meta.textContent = o.note;
      const del = document.createElement("button"); del.className = "icbtn order__del"; del.setAttribute("aria-label", "删除");
      del.innerHTML = `<svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
      del.addEventListener("click", () => { orders.splice(orders.indexOf(o), 1); renderApp(mount, true); });
      row.append(name, meta, pillSelect(o), del);
      g.appendChild(row);
    }
    list.appendChild(g);
  }
  wrap.appendChild(list);

  const savedRow = document.createElement("div");
  savedRow.className = "savedto";
  savedRow.innerHTML = `已同步到「订单」数据库<span class="flash" id="savedFlash">✓ 已保存</span>`;
  wrap.appendChild(savedRow);
  flashEl = savedRow.querySelector(".flash");

  mount.appendChild(wrap);
  const doAdd = () => {
    const input = wrap.querySelector("#mInput");
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    orders.unshift({ id: ++seq, name: v, status: "todo", note: "" });
    renderApp(mount, true);
    mount.querySelector("#mInput").focus();
  };
  wrap.querySelector("#mAdd").addEventListener("click", doAdd);
  wrap.querySelector("#mInput").addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
  mount.querySelector("#mcount").textContent = `${orders.length} 条`;
  if (saved && flashEl) { flashEl.classList.remove("on"); requestAnimationFrame(() => flashEl.classList.add("on")); }
}

const stopped = document.getElementById("stopped");
const canvas = document.getElementById("appCanvas");
const state = document.getElementById("runState");
const toggle = document.getElementById("btnToggle");
let running = false;

function setRunning(v) {
  running = v;
  stopped.hidden = v;
  canvas.hidden = !v;
  state.textContent = v ? "运行中" : "未运行";
  toggle.innerHTML = v
    ? `<svg class="ic ic--sm" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>停止`
    : `<svg class="ic ic--sm" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5v15l13-7.5Z"/></svg>运行`;
  if (v) renderApp(canvas, false);
}
toggle.addEventListener("click", () => setRunning(!running));
document.getElementById("btnRunHero").addEventListener("click", () => setRunning(true));
</script>
</body>
</html>
