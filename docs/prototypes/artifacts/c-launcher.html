<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 C · 侧栏启动器 — Terminus Notes</title>
<link rel="stylesheet" href="assets/proto.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side__head"><span class="side__avatar">刘</span><span>刘政东的 Notes</span>
      <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
    </div>
    <div class="side__search"><svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>搜索</div>
    <nav class="side__list">
      <div class="side__sec">
        <a class="tree is-current" id="navBench" href="#">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span class="tree__name">工作台</span>
        </a>
      </div>
      <div class="side__sec">
        <div class="side__label">小应用</div>
        <a class="tree" id="navTracker" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">📦 小订单追踪器</span><span class="tree__dot" id="dotTracker" hidden title="运行中"></span></a>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">📈 价格监控</span></a>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">✅ 习惯打卡</span></a>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">🧮 计算器</span></a>
      </div>
      <div class="side__sec">
        <div class="side__label">页面</div>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">本周发货记录</span></a>
        <a class="tree tree--grandchild" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span class="tree__name">订单</span></a>
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/></svg><span class="tree__name">读书记录</span></a>
      </div>
      <div class="side__sec">
        <a class="tree" href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="tree__name">回收站</span></a>
      </div>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title" id="crumb">工作台</span>
      <span class="topbar__tools">
        <button class="tbtn" id="btnBack" hidden>
          <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6-6 6-6"/><path d="M21 12H3"/></svg>工作台
        </button>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6-6 6-6"/><path d="M21 12H3"/></svg>
        </button>
        <button class="tbtn">分享</button>
        <button class="icbtn" aria-label="更多"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
      </span>
    </header>

    <div class="body">
      <!-- workbench: live tiles, the apps as first-class surfaces -->
      <div class="bench" id="bench">
        <div class="bench__head">
          <h1 class="bench__title">工作台</h1>
          <div class="bench__sub">你的小应用都在这里。点开直接用，关掉数据还在。</div>
        </div>
        <div class="tiles">
          <div class="tile tile--wide">
            <div class="tile__bar">
              <span class="tile__name">📦 小订单追踪器</span>
              <span class="datasrc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>订单</span>
              <span class="tile__acts">
                <button class="icbtn" id="tileOpen" aria-label="打开" title="打开">
                  <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                </button>
              </span>
            </div>
            <div class="tile__body" id="tileCanvas"></div>
          </div>

          <div class="tile">
            <div class="tile__bar">
              <span class="tile__name">📈 价格监控</span>
              <span class="datasrc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>行情</span>
              <span class="tile__acts">
                <button class="icbtn" aria-label="打开" title="打开"><svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></button>
              </span>
            </div>
            <div class="tile__body">
              <div class="watch">
                <svg width="100%" height="52" viewBox="0 0 300 52" preserveAspectRatio="none" aria-hidden="true">
                  <polyline points="0,34 30,30 60,33 90,26 120,28 150,20 180,24 210,16 240,19 270,12 300,14" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
                  <circle cx="300" cy="14" r="3" fill="var(--blue)"/>
                </svg>
                <div class="watch__row"><span class="watch__name">A4 复印纸</span><span class="watch__price">¥23.50</span><span class="watch__chg down">↓ 4.1%</span></div>
                <div class="watch__row"><span class="watch__name">气泡袋 20×30</span><span class="watch__price">¥8.90</span><span class="watch__chg up">↑ 1.2%</span></div>
                <div class="watch__row"><span class="watch__name">纸箱 5 号</span><span class="watch__price">¥1.45</span><span class="watch__chg down">↓ 0.7%</span></div>
              </div>
            </div>
          </div>

          <div class="tile">
            <div class="tile__bar">
              <span class="tile__name">✅ 习惯打卡</span>
              <span class="datasrc" title="不保存数据">临时</span>
              <span class="tile__acts">
                <button class="icbtn" aria-label="打开" title="打开"><svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></button>
              </span>
            </div>
            <div class="tile__body">
              <div class="habit">
                <div class="habit__row">晨跑 3km<span class="habit__days"><span class="habit__day on">✓</span><span class="habit__day on">✓</span><span class="habit__day"></span><span class="habit__day on">✓</span><span class="habit__day"></span><span class="habit__day"></span><span class="habit__day"></span></span></div>
                <div class="habit__row">读 20 页<span class="habit__days"><span class="habit__day on">✓</span><span class="habit__day"></span><span class="habit__day on">✓</span><span class="habit__day on">✓</span><span class="habit__day on">✓</span><span class="habit__day"></span><span class="habit__day"></span></span></div>
                <div class="habit__row">不喝奶茶<span class="habit__days"><span class="habit__day"></span><span class="habit__day on">✓</span><span class="habit__day on">✓</span><span class="habit__day"></span><span class="habit__day on">✓</span><span class="habit__day"></span><span class="habit__day"></span></span></div>
              </div>
            </div>
          </div>

          <div class="tile">
            <div class="tile__bar">
              <span class="tile__name">🧮 计算器</span>
              <span class="datasrc" title="不保存数据">临时</span>
            </div>
            <div class="tile__body">
              <div class="calc">
                <div class="calc__out" id="calcOut">0</div>
                <div class="calc__grid" id="calcGrid"></div>
              </div>
            </div>
          </div>

          <div class="tile" style="min-height:220px;justify-content:center;align-items:center;color:var(--ink-3);cursor:pointer" role="button" tabindex="0" aria-label="新建小应用">
            <div style="text-align:center">
              <div style="font-size:22px">＋</div>
              <div style="font-size:13px;margin-top:6px">新建小应用</div>
              <div style="font-size:12px;color:var(--ink-4);margin-top:2px">粘贴 HTML，或让 Agent 生成</div>
            </div>
          </div>
        </div>
      </div>

      <!-- a focused app surface replaces the bench when one is opened -->
      <div class="stage" id="stage" hidden>
        <div class="stage__inner">
          <section class="appsurface">
            <div class="appsurface__head">
              <span class="appsurface__icon">📦</span>
              <span class="appsurface__name">小订单追踪器</span>
              <span class="appsurface__meta">运行中</span>
              <span class="appsurface__acts">
                <a class="tbtn" href="#"><svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>订单</a>
                <button class="tbtn"><svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>源码</button>
                <button class="btn btn--ink" id="btnStopStage" style="height:28px">
                  <svg class="ic ic--sm" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>停止
                </button>
              </span>
            </div>
            <div class="appsurface__body"><div id="stageCanvas"></div></div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* same demo slice; here it lives in a tile AND in the focused surface */
const STATUS = [
  { id: "todo",  label: "待处理", cls: "pill--todo" },
  { id: "doing", label: "进行中", cls: "pill--doing" },
  { id: "done",  label: "已完成", cls: "pill--done" },
];
let seq = 5;
const orders = [
  { id: 1, name: "青禾文创 · 贴纸 200 张",   status: "doing", note: "顺丰" },
  { id: 2, name: "北岛商店 · 笔记本 ×40",    status: "todo",  note: "缺包装" },
  { id: 3, name: "拾光书店 · 明信片套装",    status: "todo",  note: "" },
  { id: 4, name: "南屿工作室 · 帆布袋 ×12",  status: "done",  note: "已签收" },
];

function pillSelect(order, onChange) {
  const s = document.createElement("select");
  s.className = "pill " + STATUS.find(t => t.id === order.status).cls;
  s.setAttribute("aria-label", "状态");
  for (const st of STATUS) {
    const o = document.createElement("option");
    o.value = st.id; o.textContent = st.label;
    if (st.id === order.status) o.selected = true;
    s.appendChild(o);
  }
  s.addEventListener("change", () => {
    order.status = s.value;
    s.className = "pill " + STATUS.find(t => t.id === order.status).cls;
    onChange();
  });
  return s;
}

function mountApp(mount, padded, onChange) {
  mount.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "miniapp" + (padded ? " miniapp--pad" : "");
  wrap.innerHTML = `<div class="miniapp__head"><span class="miniapp__count"></span></div>
    <div class="miniapp__add"><input placeholder="记一笔订单，回车提交"><button class="btn btn--ink">添加</button></div>`;
  const list = document.createElement("div");
  list.className = "orders";
  for (const st of STATUS) {
    const group = orders.filter(o => o.status === st.id);
    if (!group.length) continue;
    const g = document.createElement("div");
    g.className = "orders__group";
    g.innerHTML = `<div class="orders__label">${st.label}<span class="n">${group.length}</span></div>`;
    for (const o of group) {
      const row = document.createElement("div");
      row.className = "order";
      const name = document.createElement("span"); name.className = "order__name"; name.textContent = o.name;
      const meta = document.createElement("span"); meta.className = "order__meta"; meta.textContent = o.note;
      const del = document.createElement("button"); del.className = "icbtn order__del"; del.setAttribute("aria-label","删除");
      del.innerHTML = `<svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
      del.addEventListener("click", () => { orders.splice(orders.indexOf(o), 1); onChange(true); });
      row.append(name, meta, pillSelect(o, () => onChange(true)), del);
      g.appendChild(row);
    }
    list.appendChild(g);
  }
  wrap.appendChild(list);
  const saved = document.createElement("div");
  saved.className = "savedto";
  saved.innerHTML = `已同步到「订单」数据库`;
  wrap.appendChild(saved);
  mount.appendChild(wrap);
  wrap.querySelector(".miniapp__count").textContent = `${orders.length} 条`;
  const input = wrap.querySelector("input");
  const doAdd = () => {
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    orders.unshift({ id: ++seq, name: v, status: "todo", note: "" });
    onChange(true);
    setTimeout(() => { const i = mount.querySelector("input"); if (i) i.focus(); }, 0);
  };
  wrap.querySelector(".btn").addEventListener("click", doAdd);
  input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
}

const bench = document.getElementById("bench");
const stage = document.getElementById("stage");
const crumb = document.getElementById("crumb");
const btnBack = document.getElementById("btnBack");
const dot = document.getElementById("dotTracker");
const navBench = document.getElementById("navBench");
const navTracker = document.getElementById("navTracker");
let open = false;

function refreshTiles() {
  mountApp(document.getElementById("tileCanvas"), false, () => refreshAll());
}
function refreshStage() {
  mountApp(document.getElementById("stageCanvas"), true, () => refreshAll());
}
function refreshAll() {
  refreshTiles();
  if (open) refreshStage();
}

function setOpen(v) {
  open = v;
  bench.hidden = v;
  stage.hidden = !v;
  btnBack.hidden = !v;
  dot.hidden = !v;
  crumb.innerHTML = v
    ? `<span class="crumb-parent" id="crumbBench">工作台</span><span class="crumb-sep">/</span><span>📦 小订单追踪器</span>`
    : `工作台`;
  navBench.classList.toggle("is-current", !v);
  navTracker.classList.toggle("is-current", v);
  if (v) refreshStage();
}
document.getElementById("tileOpen").addEventListener("click", () => setOpen(true));
navTracker.addEventListener("click", e => { e.preventDefault(); setOpen(true); });
navBench.addEventListener("click", e => { e.preventDefault(); setOpen(false); });
btnBack.addEventListener("click", () => setOpen(false));
document.getElementById("btnStopStage").addEventListener("click", () => setOpen(false));

/* little calculator — a no-database app */
const calcOut = document.getElementById("calcOut");
const keys = ["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","=","+"];
let expr = "";
const calcGrid = document.getElementById("calcGrid");
keys.forEach(k => {
  const b = document.createElement("button");
  b.className = "calc__key" + (k === "=" ? " calc__key--eq" : "÷×−+".includes(k) ? " calc__key--op" : "");
  b.textContent = k;
  b.addEventListener("click", () => {
    if (k === "=") {
      try { expr = String(Function(`return (${expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-")})`)()); }
      catch { expr = ""; }
    } else expr += k;
    calcOut.textContent = expr || "0";
  });
  calcGrid.appendChild(b);
});

/* habit days toggle */
document.querySelectorAll(".habit__day").forEach(d => d.addEventListener("click", () => {
  d.classList.toggle("on");
  d.textContent = d.classList.contains("on") ? "✓" : "";
}));

refreshTiles();
</script>
</body>
</html>
